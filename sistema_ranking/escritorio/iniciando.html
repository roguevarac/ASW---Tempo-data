<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Auditor de Rankings Digitales — iniciando</title>
<style>
  :root { color-scheme: dark; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #0E1520; color: #E8E6DF;
         font: 15px/1.5 system-ui, "Segoe UI", sans-serif; }
  main { max-width: 460px; padding: 32px 24px; text-align: center; }
  h1 { font-size: 20px; margin: 16px 0 8px; font-weight: 600; }
  p { color: #8A97A8; margin: 8px 0; }
  .logo { width: 72px; height: 72px; border-radius: 16px; background: #0f4bab; display: inline-grid; place-items: end center;
          padding-bottom: 14px; box-sizing: border-box; gap: 4px; grid-auto-flow: column; }
  .logo i { display: block; width: 9px; background: #fff; }
  .punto { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: #0f4bab; margin: 0 3px;
           animation: latido 1.2s infinite ease-in-out; }
  .punto:nth-child(2) { animation-delay: .2s; } .punto:nth-child(3) { animation-delay: .4s; }
  @keyframes latido { 0%, 80%, 100% { opacity: .25; } 40% { opacity: 1; } }
  @media (prefers-reduced-motion: reduce) { .punto { animation: none; opacity: .8; } }
</style>
</head>
<body>
<main>
  <div class="logo" aria-hidden="true"><i style="height:20px"></i><i style="height:30px"></i><i style="height:40px"></i></div>
  <h1>Iniciando Auditor de Rankings Digitales</h1>
  <p aria-live="polite">Iniciando el servidor <span class="punto"></span><span class="punto"></span><span class="punto"></span></p>
  <p>El primer inicio del día puede demorar hasta un minuto.</p>
  <p id="ayuda" hidden>El inicio demora más de lo habitual. Ejecutá en la terminal de Ubuntu
     <code>bash ranking.sh verificar</code> y, si informa un error, <code>bash ranking.sh logs</code>.</p>
</main>
<script>
  // Prueba con una imagen del sistema (funciona desde un archivo local hacia localhost): apenas responde, entra.
  const URL_APP = 'http://localhost:__PUERTO__/';
  const inicio = Date.now();
  function probar() {
    const img = new Image();
    img.onload = () => location.replace(URL_APP);
    img.onerror = () => {
      if (Date.now() - inicio > 120000) document.getElementById('ayuda').hidden = false;
      setTimeout(probar, 1500);
    };
    img.src = URL_APP + 'iconos/icono-32.png?t=' + Date.now();
  }
  probar();
</script>
</body>
</html>

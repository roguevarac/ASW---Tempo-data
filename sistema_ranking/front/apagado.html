<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Auditor de Rankings Digitales — iniciando</title>
<link rel="icon" href="iconos/icono-32.png">
<style>
  :root { color-scheme: dark; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #0E1520; color: #E8E6DF;
         font: 15px/1.5 system-ui, "Segoe UI", sans-serif; }
  main { max-width: 460px; padding: 32px 24px; text-align: center; }
  img { width: 72px; height: 72px; }
  h1 { font-size: 20px; margin: 16px 0 8px; font-weight: 600; }
  p { color: #8A97A8; margin: 8px 0; }
  .punto { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: #0f4bab; margin: 0 3px;
           animation: latido 1.2s infinite ease-in-out; }
  .punto:nth-child(2) { animation-delay: .2s; } .punto:nth-child(3) { animation-delay: .4s; }
  @keyframes latido { 0%, 80%, 100% { opacity: .25; } 40% { opacity: 1; } }
  @media (prefers-reduced-motion: reduce) { .punto { animation: none; opacity: .8; } }
</style>
</head>
<body>
<main>
  <img src="iconos/icono-192.png" alt="">
  <h1>Auditor de Rankings Digitales está iniciando o apagado</h1>
  <p aria-live="polite" id="estado">Esperando al servidor <span class="punto"></span><span class="punto"></span><span class="punto"></span></p>
  <p id="ayuda" hidden>Si el sistema no inicia, abrí <b>Auditor de Rankings Digitales</b> desde el escritorio o el menú Inicio. Si
     continúa sin responder, ejecutá en la terminal de Ubuntu: <code>bash ranking.sh verificar</code>.</p>
</main>
<script>
  // Se reintenta sola: apenas el servidor responde, entra al sistema.
  const inicio = Date.now();
  async function probar() {
    try {
      const r = await fetch('/health', { cache: 'no-store' });
      if (r.ok) { location.replace('/'); return; }
    } catch (e) { /* todavía no responde */ }
    if (Date.now() - inicio > 45000) document.getElementById('ayuda').hidden = false;
    setTimeout(probar, 2000);
  }
  probar();
</script>
</body>
</html>

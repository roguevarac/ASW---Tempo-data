<html lang="es">
<head>

<style>
:root{
  --void:#0E1520; --panel:#161F2C; --panel-raised:#1D2836; --line:#2B3A4C; --line-soft:#22303F;
  --text-primary:#E8E6DF; --text-muted:#8A97A8; --brass:#0f4bab; --brass-dim:#0b3785;
  --green:#5FA980; --green-bg:#1B2B23; --red:#C15C51; --red-bg:#2C1D1A; --blue:#FFFFFF; --blue-bg:#1A2530;
}
*{box-sizing:border-box;}
body{margin:0;background:var(--void);color:var(--text-primary);font-family:'IBM Plex Sans',sans-serif;-webkit-font-smoothing:antialiased;}
.mono{font-family:'IBM Plex Mono',monospace;}
.display{font-family:'Space Grotesk',sans-serif;}
.app{max-width:1180px;margin:0 auto;padding:28px 24px 60px;}

.login-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;}
.login-card{width:340px;background:var(--panel);border:1px solid var(--line);border-radius:4px;padding:28px 26px;}
.login-card h1{font-size:16px;margin:0 0 4px;font-family:'Space Grotesk',sans-serif;}
.login-card p{font-size:12.5px;color:var(--text-muted);margin:0 0 20px;}
.login-card label{font-size:11px;color:var(--text-muted);text-transform:uppercase;letter-spacing:0.06em;display:block;margin-bottom:5px;}
.login-card input{width:100%;background:var(--panel-raised);border:1px solid var(--line);border-radius:3px;padding:9px 10px;color:var(--text-primary);font-size:13px;margin-bottom:14px;}
.login-card input:focus{outline:none;border-color:var(--brass-dim);}
.login-card .err{color:var(--red);font-size:12px;margin:-6px 0 12px;min-height:14px;}

.topbar{display:flex;align-items:flex-start;justify-content:space-between;padding-bottom:20px;border-bottom:1px solid var(--line);}
.wordmark{display:flex;align-items:center;gap:12px;}
.wordmark .mark{width:34px;height:34px;border:1.5px solid var(--brass);border-radius:2px;display:flex;align-items:center;justify-content:center;color:var(--brass);font-size:13px;font-weight:600;font-family:'Space Grotesk',sans-serif;flex-shrink:0;}
.wordmark h1{font-size:17px;letter-spacing:0.02em;margin:0;font-weight:600;}
.wordmark p{margin:2px 0 0;font-size:12.5px;color:var(--text-muted);}
.session{display:flex;flex-direction:column;align-items:flex-end;gap:6px;}
.session .who{font-size:12.5px;}
.session .who .mono{color:var(--brass);}
.session button{background:none;border:1px solid var(--line);color:var(--text-muted);font-size:11.5px;padding:5px 10px;border-radius:3px;cursor:pointer;}
.session button:hover{border-color:var(--brass-dim);color:var(--brass);}
.last-chart{font-size:11px;color:var(--text-muted);margin-top:2px;}
.last-chart .mono{color:var(--brass);}

.tabs{display:flex;gap:2px;margin-top:22px;border-bottom:1px solid var(--line);}
.tab{padding:10px 16px;font-size:13px;color:var(--text-muted);cursor:pointer;border-bottom:2px solid transparent;position:relative;user-select:none;}
.tab.active{color:var(--brass);border-bottom-color:var(--brass);}
.tab:not(.active):hover{color:var(--text-primary);}
.tab .lock{font-size:10px;margin-left:5px;color:var(--text-muted);}

.panel-body{padding-top:18px;}
.toolbar{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:12px;flex-wrap:wrap;}
.toolbar-left{display:flex;gap:10px;align-items:center;flex-wrap:wrap;}
.search{background:var(--panel);border:1px solid var(--line);border-radius:3px;padding:8px 10px;color:var(--text-primary);font-size:13px;width:240px;}
.search::placeholder{color:var(--text-muted);}
.search:focus{outline:none;border-color:var(--brass-dim);}
select{background:var(--panel);border:1px solid var(--line);border-radius:3px;padding:8px 10px;color:var(--text-primary);font-size:13px;}
select:focus{outline:none;border-color:var(--brass-dim);}
.btn{background:transparent;border:1px solid var(--line);color:var(--text-primary);padding:8px 13px;font-size:12.5px;border-radius:3px;cursor:pointer;display:inline-flex;align-items:center;gap:6px;}
.btn:hover{border-color:var(--brass-dim);color:var(--brass);}
.btn.primary{background:var(--brass);border-color:var(--brass);color:#FFFFFF;font-weight:500;}
.btn.primary:hover{background:#1a5cc4;color:#FFFFFF;}
.btn:disabled{opacity:0.35;cursor:not-allowed;}
.check{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--text-muted);}

table{width:100%;border-collapse:collapse;font-size:12.5px;}
thead th{text-align:left;color:var(--text-muted);font-weight:500;font-size:10.5px;text-transform:uppercase;letter-spacing:0.05em;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap;position:sticky;top:0;background:var(--void);z-index:5;}
tbody td{padding:7px 10px;border-bottom:1px solid var(--line-soft);vertical-align:middle;}
tbody tr:hover{background:var(--panel);}
tbody tr.is-deleted{opacity:0.45;}
.num{text-align:right;font-family:'IBM Plex Mono',monospace;}
.tempo{font-family:'IBM Plex Mono',monospace;color:var(--text-muted);}
.badge{display:inline-block;padding:2px 8px;border-radius:20px;font-size:10.5px;font-weight:500;}
.badge.ok{background:var(--green-bg);color:var(--green);}
.badge.dup{background:var(--red-bg);color:var(--red);}
.badge.unc{background:var(--blue-bg);color:var(--blue);}
.badge.pct{background:var(--red-bg);color:var(--red);}
.rowbtn{background:none;border:none;color:var(--text-muted);cursor:pointer;font-size:11.5px;padding:3px 6px;}
.rowbtn:hover{color:var(--red);}
.empty{padding:40px 10px;text-align:center;color:var(--text-muted);font-size:13px;}
.locked{padding:40px 20px;text-align:center;color:var(--text-muted);font-size:13px;max-width:420px;margin:0 auto;}
.locked .lk{font-size:11px;color:var(--brass);text-transform:uppercase;letter-spacing:0.08em;margin-bottom:8px;}
.drop{border:1.5px dashed var(--line);border-radius:4px;padding:34px 20px;text-align:center;margin-bottom:18px;background:var(--panel);}
.drop.over{border-color:var(--brass);background:var(--panel-raised);}
.drop p{margin:0 0 4px;font-size:13px;}
.drop .hint{font-size:11.5px;color:var(--text-muted);}
.drop input{display:none;}
.summary-row{display:flex;gap:10px;margin-bottom:14px;flex-wrap:wrap;}
.metric{background:var(--panel);border-radius:3px;padding:10px 14px;flex:1;min-width:120px;}
.metric .n{font-size:20px;font-weight:500;font-family:'IBM Plex Mono',monospace;}
.metric .l{font-size:10.5px;color:var(--text-muted);text-transform:uppercase;letter-spacing:0.05em;margin-top:2px;}
.metric.err .n{color:var(--red);}
.metric.ok .n{color:var(--green);}
.metric.new .n{color:var(--blue);}
footer{margin-top:30px;padding-top:16px;border-top:1px solid var(--line);font-size:11px;color:var(--text-muted);display:flex;justify-content:space-between;}

.edit-field{background:var(--panel-raised);border:1px solid var(--line);border-radius:3px;padding:4px 6px;color:var(--text-primary);font-size:12px;font-family:'IBM Plex Mono',monospace;width:100%;}
.edit-field:focus{outline:none;border-color:var(--brass-dim);}
.edit-field.empty-flag{border-color:var(--red);}
select.edit-field{font-family:'IBM Plex Sans',sans-serif;}
.control-country{display:flex;align-items:center;gap:10px;margin-bottom:14px;font-size:12.5px;color:var(--text-muted);}
.upload-guide{background:var(--panel);border:1px solid var(--line);border-radius:4px;padding:16px 18px;margin-bottom:16px;}
.upload-guide h3{font-size:14px;margin:0 0 6px;font-family:'Space Grotesk',sans-serif;}
.upload-guide p{font-size:13px;margin:0 0 10px;color:var(--text-muted);}
.upload-guide ul{margin:10px 0 0;padding-left:18px;font-size:12.5px;color:var(--text-muted);}
.upload-guide li{margin:4px 0;}
.upload-guide li b{color:var(--text-primary);font-weight:500;}
.tipos{display:flex;gap:8px;flex-wrap:wrap;}
.tipo-chip{padding:4px 10px;border-radius:20px;font-size:12px;background:var(--panel-raised);border:1px solid var(--line);}
.tipo-chip small{color:var(--text-muted);margin-left:4px;}
.progreso{height:6px;background:var(--panel-raised);border-radius:3px;overflow:hidden;margin:4px 0 8px;}
.progreso div{height:100%;background:var(--brass);transition:width .3s;}
.progreso-txt{font-size:12.5px;color:var(--text-muted);margin-bottom:12px;}
.estado{font-size:11.5px;white-space:nowrap;}
.estado.ok{color:var(--green);}
.estado.err{color:var(--red);}
.estado.run{color:var(--brass);}
.estado.wait{color:var(--text-muted);}
.pager{display:flex;gap:10px;align-items:center;justify-content:flex-end;margin-top:12px;font-size:12.5px;color:var(--text-muted);}
.pager .btn:disabled{opacity:0.4;cursor:default;}
.pager .conteo-id{margin-right:auto;}
.subtabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px;}
.subtab{background:var(--panel);border:1px solid var(--line);color:var(--text-muted);border-radius:3px;padding:7px 12px;font-size:12.5px;cursor:pointer;}
.subtab.active{border-color:var(--brass);color:var(--text-primary);}
.subtab .cnt{font-family:'IBM Plex Mono',monospace;font-size:11px;margin-left:6px;color:var(--text-muted);}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px;}
.chip{background:none;border:1px solid var(--line);color:var(--text-muted);border-radius:20px;padding:3px 11px;font-size:12px;cursor:pointer;}
.chip.active{background:var(--brass);border-color:var(--brass);color:#fff;}
.chip:disabled{opacity:0.35;cursor:default;}
.hist-nota{font-size:12.5px;color:var(--text-muted);margin:0 0 12px;}
.hist-sec{font-size:12px;color:var(--text-muted);text-transform:uppercase;letter-spacing:0.05em;margin:22px 0 6px;}
tr.clic{cursor:pointer;}
tr.clic:hover td{background:var(--panel-raised);}
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,0.6);display:flex;align-items:center;justify-content:center;z-index:100;}
.modal{background:var(--panel);border:1px solid var(--line);border-radius:4px;width:min(1500px,96vw);max-height:88vh;overflow:auto;padding:22px 24px;}
.modal h2{font-size:15px;margin:0 0 4px;font-family:'Space Grotesk',sans-serif;}
.modal .sub{font-size:12px;color:var(--text-muted);margin:0 0 16px;}
.modal .close{position:sticky;top:0;float:right;background:none;border:1px solid var(--line);color:var(--text-muted);border-radius:3px;padding:4px 9px;cursor:pointer;font-size:12px;}
.modal .close:hover{border-color:var(--brass-dim);color:var(--brass);}
.modal table{font-size:12px;}
.modal.small{width:min(620px,96vw);}
/* Panel de control */
.panel-actualizar{margin-left:auto;padding:6px 11px;}
.panel-hora{font-size:11.5px;color:var(--text-muted);align-self:center;}
.tarjetas{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:14px;margin-bottom:18px;}
.tarjeta{background:var(--panel);border:1px solid var(--line);border-radius:4px;padding:14px 16px;}
.tarjeta.ancha{grid-column:1/-1;}
.tarjeta h3,.titulo-panel{font-size:12px;text-transform:uppercase;letter-spacing:0.06em;color:var(--text-muted);margin:0 0 10px;font-weight:500;}
.titulo-panel{margin:22px 0 10px;}
.servicio{display:flex;gap:10px;align-items:flex-start;padding:7px 0;border-bottom:1px solid var(--line-soft);}
.servicio:last-child{border-bottom:none;}
.punto{display:inline-block;width:9px;height:9px;border-radius:50%;margin:4px 6px 0 0;flex:none;vertical-align:baseline;}
.punto.ok{background:var(--green);} .punto.error{background:var(--red);} .punto.aviso{background:#D9A441;} .punto.apagado{background:var(--line);}
.estado-ok{color:var(--green);} .estado-error{color:var(--red);} .estado-aviso{color:#D9A441;} .estado-apagado{color:var(--text-muted);}
.det{font-size:11.5px;color:var(--text-muted);margin-top:2px;}
.dato{display:flex;justify-content:space-between;gap:12px;padding:5px 0;font-size:12.5px;}
.dato span{color:var(--text-muted);} .dato b{font-weight:500;text-align:right;}
.barra-uso{height:5px;background:var(--panel-raised);border-radius:3px;overflow:hidden;margin:0 0 6px;}
.barra-uso div{height:100%;background:var(--green);} .barra-uso.media div{background:#D9A441;} .barra-uso.alta div{background:var(--red);}
.acciones-panel{display:flex;gap:10px;align-items:center;margin:12px 0 6px;flex-wrap:wrap;}
.filtros-panel{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:10px;}
.filtros-panel .search{width:260px;} .corto{width:110px !important;}
.tabla-panel td{vertical-align:top;}
.acciones-usuario{display:flex;gap:6px;flex-wrap:wrap;}
.acciones-usuario .btn{padding:4px 9px;font-size:11.5px;}
.aviso-panel{background:var(--green-bg);color:var(--green);border-radius:3px;padding:8px 12px;font-size:12.5px;margin-bottom:12px;}
.aviso-panel.error{background:var(--red-bg);color:var(--red);}
.nota-panel{font-size:11.5px;color:var(--text-muted);}
.consola{background:#0A0F17;border:1px solid var(--line);border-radius:4px;padding:12px;font-family:'IBM Plex Mono',monospace;font-size:11.5px;max-height:60vh;overflow:auto;}
.consola .linea{padding:1px 0;white-space:pre-wrap;word-break:break-word;color:var(--text-primary);}
.consola .linea span{color:var(--text-muted);} .consola .linea.aviso b{color:#D9A441;} .consola .linea.error b,.consola .linea.error{color:var(--red);}
.codigo-grande{font-family:'IBM Plex Mono',monospace;font-size:28px;letter-spacing:0.12em;text-align:center;padding:18px;background:var(--panel-raised);border-radius:4px;margin:8px 0 12px;user-select:all;}
.login-links{display:flex;justify-content:space-between;gap:10px;margin-top:14px;font-size:12px;}
.login-links a,.login-volver{color:var(--text-muted);cursor:pointer;text-decoration:underline;}
.login-links a:hover,.login-volver:hover{color:var(--brass);}
.login-card .ok{color:var(--green);font-size:12.5px;margin:-6px 0 12px;}
.login-card .nota{font-size:12.5px;color:var(--text-muted);margin:0 0 12px;}
.envio-op{display:block;width:100%;text-align:left;margin:0 0 10px;padding:12px 14px;}
.envio-op b{display:block;font-size:13px;margin-bottom:3px;}
.envio-op span{font-size:12px;color:var(--text-muted);}
.envio-op:disabled{opacity:0.45;cursor:default;}
.manual-link{font-size:11.5px;color:var(--text-muted);text-decoration:none;border:1px solid var(--line);padding:5px 10px;border-radius:3px;}
.manual-link:hover{border-color:var(--brass-dim);color:var(--brass);}
.modal tbody td{padding:6px 8px;}
.modal thead th{padding:7px 8px;background:var(--panel);}
.val-old{color:var(--red);}
.val-new{color:var(--green);}
</style>

<!-- ============================================================
  CONFIGURACIÓN — sistema propio (sin Supabase). La URL de la API va
  vacía cuando el front lo sirve la misma API.
============================================================= -->
<script>
// API propia: vacío = mismo servidor que sirve esta página.
const SUPABASE_URL = '';
const SUPABASE_ANON_KEY = '';
</script>

<div id="root"></div>

<script>
const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
const COUNTRIES = ['AR','CL','PE','UY','PY','CO','EC','MX'];
const COUNTRY_ALIASES = { ar:'AR', arg:'AR', cl:'CL', chl:'CL', pe:'PE', per:'PE', uy:'UY', ury:'UY', py:'PY', pry:'PY', co:'CO', col:'CO', ec:'EC', ecu:'EC', mx:'MX', mex:'MX' };
const ESTADO_TRABAJO_OPTIONS = ['REVISAR','OK BO-Tempo','duplicada','dif de split'];
const ESTADOS = ['ok','duplicada','uncontrolled','porcentaje_incorrecto'];

let state = {
  session: null, profile: null, loginError: '',
  activeTab: 'master', search: '', territoryCountry: '', reclamosFilter: '', estadoTrabajoFilter: '',
  dateFrom: '', dateTo: '', masterCountry: '', history: null, historyLoading: false,
  master: [], territoryControl: [], uploads: [], loading: true,
  uploadQueue: [], uploadIndex: -1, uploading: false,
  historial: null, histTab: 'youtube', histPais: '', controlCountry: '', lastChartLoad: null, lastLoads: {}, lastCountry: '',
  envioDialog: null,
  loginModo: 'ingresar', loginAviso: '',
  panel: { acceso: false, sub: 'estado', datos: {}, filtrosAct: {}, eventoServicio: '', error: '', mensaje: '',
           codigo: null, ocupado: false, actualizado: null },
  masterTotal: 0, masterPage: 0, territoryTotal: 0, territoryPage: 0, territoryStale: true,
  territoryOpciones: { reclamos: [], estado_trabajo: [] }, seqMaster: 0, seqTerritory: 0, envioBusy: false,
};

function fmtNum(n){ return n===null || n===undefined ? '—' : Number(n).toLocaleString('es-AR'); }
function canWrite(){ return state.profile?.app_role==='admin' || state.profile?.app_role==='usuario_estandar'; }
function canUpload(){ return canWrite(); }

function badgeFor(estado){
  const map = {ok:['ok','ok'], duplicada:['dup','duplicada'], uncontrolled:['unc','uncontrolled'], porcentaje_incorrecto:['pct','% incorrecto']};
  const [cls,label] = map[estado] || ['unc', estado||'—'];
  return `<span class="badge ${cls}">${label}</span>`;
}

function detectCountry(sourceName){
  const text = `${sourceName||''}`.toLowerCase();
  for(const [alias, code] of Object.entries(COUNTRY_ALIASES)){
    const re = new RegExp(`(^|[^a-z])${alias}([^a-z]|$)`);
    if(re.test(text)) return code;
  }
  return null;
}

// ---------- Datos reales desde Postgres (vía Supabase) ----------
async function loadProfile(){
  const { data, error } = await sb.from('app_users').select('app_role,oficina').eq('user_id', state.session.user.id).single();
  state.profile = error ? { app_role:'usuario_estandar', oficina:null } : data;
  await loadPanelAcceso();
}
async function fetchAll(fn, params){
  const PAGE = 50000;   // la API propia no tiene el límite de 1.000 filas de Supabase: menos vueltas, sin recalcular
  let from = 0;
  const all = [];
  while(true){
    const { data, error } = await sb.rpc(fn, params).range(from, from + PAGE - 1);
    if(error) return { data: all, error };
    all.push(...(data || []));
    if(!data || data.length < PAGE) break;
    from += PAGE;
  }
  return { data: all, error: null };
}

// Las tablas se piden de a una página (PAGE_SIZE filas) ya filtrada, buscada y ordenada por la base, con el total.
// Así abrir la aplicación no depende de cuántos charts haya cargados.
const PAGE_SIZE = 100;

function filtrosFechas(){
  return { p_date_from: state.dateFrom || null, p_date_to: state.dateTo || null };
}
function incluyeEliminados(){ return false; }

async function loadMaster(){
  const seq = ++state.seqMaster;
  const filtros = {
    ...filtrosFechas(), p_pais: state.masterCountry || null, p_include_deleted: incluyeEliminados(),
    p_buscar: state.activeTab === 'master' ? (state.search || null) : null,
  };
  // Obras identificadas (con Tempo ID o marcador) y sin identificar: se vuelven a contar solo si cambian los filtros
  // (al pasar de página no) o después de un cambio (se borra state.masterConteoClave).
  const clave = JSON.stringify(filtros);
  const contar = clave !== state.masterConteoClave
    ? sb.rpc('fn_master_conteo', filtros) : Promise.resolve(null);
  const [{ data, error }, conteo] = await Promise.all([
    sb.rpc('fn_master_pagina', { ...filtros, p_limite: PAGE_SIZE, p_offset: state.masterPage * PAGE_SIZE }), contar]);
  if(seq !== state.seqMaster) return;           // llegó una respuesta más nueva
  if(conteo && !conteo.error && conteo.data?.[0]){
    state.masterConteo = { identificadas: Number(conteo.data[0].identificadas), sin: Number(conteo.data[0].sin_identificar) };
    state.masterConteoClave = clave;
  }
  if(error) console.error('fn_master_pagina:', error.message);

async function loadTerritory(){

let esperaBusqueda = null;

  esperaBusqueda = setTimeout(async () => {
    if(state.activeTab === 'master'){ state.masterPage = 0; await loadMaster(); }

async function updateMasterField(id, field, value){
  if(field === 'tempo_id'){
    // Si otra obra ya tiene ese Tempo ID, es la misma canción escrita de otra forma: con la confirmación de la
    // persona, las dos obras se unifican en la que ya lo tenía (charts, reportes y envíos de ambas).
    const limpio = String(value || '').trim();
    let unificar = false;
    if(/^[0-9]+$/.test(limpio)){
      const { data: otras } = await sb.from('tracks_master').select('id,track_artist_concat').eq('tempo_id', limpio).limit(2);
      const otra = (otras || []).find(o => o.id !== id);
      if(otra){
        unificar = confirm(`El Tempo ID ${limpio} ya está asignado a "${otra.track_artist_concat}".\n\n`
          + `Si es la misma canción, aceptá para unificar las dos obras en "${otra.track_artist_concat}", con los `
          + `charts, reportes y envíos de ambas. Para cancelar, presioná Cancelar.`);
        if(!unificar){ await loadMaster(); render(); return; }
      }
    }
    const { data, error } = await sb.rpc('fn_asignar_tempo_id', { p_track_id: id, p_tempo_id: value, p_unificar: unificar });
    if(error) alert('No se guardó el Tempo ID. ' + error.message);
    else if(data > 0) alert('Las obras quedaron unificadas.');
    loadAll();
    return;
  }
  const patch = {}; patch[field] = value === '' ? null : value;
  await sb.from('tracks_master').update(patch).eq('id', id);
  loadAll();
}

}

// Fecha y hora en la hora local de la PC (la base las guarda en UTC): "2026-10-21 20:22".

async function startEnvio(modo){

// Guarda una copia de lo descargado (queda registrada; el Historial de cargas no la muestra porque no es una carga).
async function archiveDownload(blob, filename, format, carpeta, total){
  const hoy = new Date().toISOString().slice(0,10);
  const path = `${carpeta}/${hoy}/${Date.now()}_${filename}`;
  const { error: upErr } = await sb.storage.from('csv-uploads').upload(path, blob);
  await sb.from('csv_uploads').insert({
    filename, format,
    total_rows: total, updated_rows: total, created_tracks: 0,
    error_count: upErr ? 1 : 0,
    errors: upErr ? [`No se pudo archivar en Storage: ${upErr.message}`] : null,
    file_path: upErr ? null : path,
  });
  if(upErr) alert('El archivo se descargó, pero no se pudo guardar una copia en el sistema: ' + upErr.message);
}

async function downloadBoReport(envio, modo){
  const carga = envio.carga;
  const { data: rows, error } = await fetchAll('fn_envio_obras', { p_envio_id: envio.envio_id });
  if(error){ alert('No se pudo generar el reporte: ' + error.message); return; }

  const sinTitulo = rows.filter(r => !r.track_name_clean).length;
  if(sinTitulo){
    alert(`${sinTitulo} obra(s) no tienen título disponible y quedarían vacías en el reporte. Verificá que el sistema esté actualizado.`);
  }

  // Sin fila de encabezado: el archivo se sube directo.
  // En los títulos se sacan "," y ";" porque Excel (y algunos sistemas)
  // los toman como separador y parten el nombre en otra columna.
  const lines = [];
  rows.forEach(r => {
    const track = (r.track_name_clean || '')
      .replace(/[;,]/g, ' ')
      .replace(/\s+/g, ' ')
      .trim();
    lines.push(`${String(r.tempo_id).trim()};${track};BOcarga${carga}`);
  });

  const filename = `reporte_bo_carga${carga}${modo === 'nuevas' ? '_nuevas' : ''}.csv`;
  const blob = new Blob([lines.join('\n')], {type:'text/csv;charset=utf-8;'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = filename;
  a.click();

  // Archivar una copia de lo que se mandó a BO, y dejarlo en el historial.
  await archiveDownload(blob, filename, 'bo_generado', 'bo_generado', rows.length);
}

async function downloadMasterCsv(envio, modo){
  const filename = `tabla_principal${modo === 'nuevas' ? '_nuevas' : ''}.csv`;
  const blob = await downloadFilteredCsv('fn_envio_obras', { p_envio_id: envio.envio_id }, filename, 'track_artist_concat,tempo_id');
  if(blob) await archiveDownload(blob, filename, 'csv_principal', 'csv_principal', envio.obras);

// El CSV completo en una sola consulta (la API no tiene el límite de 1.000 filas de Supabase y lo envía comprimido).
async function downloadFilteredCsv(fn, params, filename, columns){

// Traduce cualquier variante de encabezado (con espacios, puntos, %, mayúsculas)
// a una clave canónica común entre los tres formatos de CSV soportados.
const HEADER_ALIASES = {
  source_name:'source_name', rank:'rank', previous_rank:'previous_rank', peak_rank:'peak_rank',
  track_name:'track_name', artist_names:'artist_names', artist_name:'artist_names',
  weeks_on_chart:'weeks_on_chart', periods_on_chart:'weeks_on_chart',
  streams:'streams', views:'streams',
  weekly_growth:'weekly_growth', growth:'weekly_growth',
  uri:'uri', youtube_url:'uri', source:'source',
  // Formato viejo de Spotify Charts: Position, Track Name, Artist, Streams, URL.
  position:'rank', artist:'artist_names', url:'uri',
  tempo_id:'tempo_id', bo_id:'bo_id', ctrl:'percent_ctrl', percent_ctrl:'percent_ctrl',
  collect_mec:'collect_mec', collect_ejec:'collect_ejec', control:'control', cwr:'cwr', nota:'nota',
  submitters_song_code:'tempo_id', internal_song_code:'bo_id',
  song_owners:'ca', song_owner:'ca', songowners:'ca', owners:'ca',
  bointernal_status:'bo_status', internal_status:'bo_status', counterclaim_status:'reclamos',
  song_id:'tempo_id', song_title_tx:'song_title', pais:'pais_nombre',
  performance_pc_total:'perf_pc', mechanical_pc_total:'mech_pc', sync_pc_total:'sync_pc',
  publishers:'publishers', contratos_del_pais:'contratos',
  song_tempo_create_date:'created_date', estado_obra:'estado_obra',
  track_artista:'track_artist_concat', track_artist:'track_artist_concat',
  tipo_de_distribucion:'tipo_distribucion',
  numero_de_distribucion:'numero_distribucion',
  fase_distribucion:'fase_distribucion',
  dsp:'dsp',
  periodo:'periodo',
  codigo_obra:'codigo_obra',
  titulo_obra:'titulo_obra',
  traduccion_subtitulo_interprete:'interprete',
  numero_cae_derechohabiente:'cae_derechohabiente',
  nombre_derechohabiente:'nombre_derechohabiente',
  sociedad_derechohabiente:'sociedad_derechohabiente',
  tipo_participacion_derechohabiente:'tipo_participacion',
  porcentaje_derechohabiente:'porcentaje_derechohabiente',
  monto_radio:'monto_radio',
  monto_variedades_tv_abierta:'monto_tv_abierta',
  monto_tv_cable:'monto_tv_cable',
  monto_usos_ugp:'monto_ugp',
  monto_online:'monto_online',
  monto_total:'monto_total',
};
function canonicalHeader(h){
  const key = stripAccents(h.replace(/^\uFEFF/, '')).trim().toLowerCase().replace(/[^a-z0-9]+/g, '_').replace(/^_+|_+$/g, '');
  if(HEADER_ALIASES[key]) return HEADER_ALIASES[key];
  if(key.startsWith('mechanicall_collect_share')) return 'mech_bo';
  if(key.includes('owner')) return 'ca';
  if(key.includes('status') && !key.includes('claim')) return 'bo_status';
  return key;
}

const COUNTRY_NAME_ALIASES = { ARGENTINA:'AR', CHILE:'CL', PERU:'PE', URUGUAY:'UY', PARAGUAY:'PY', COLOMBIA:'CO', ECUADOR:'EC', MEXICO:'MX' };
function stripAccents(s){ return s.normalize('NFD').replace(/[\u0300-\u036f]/g,''); }
function detectCountryFromFilename(filename){
  if(!filename) return null;
  const clean = stripAccents(filename).toUpperCase();
  const afterPais = clean.match(/PAIS_([A-Z]+)/);
  if(afterPais && COUNTRY_NAME_ALIASES[afterPais[1]]) return COUNTRY_NAME_ALIASES[afterPais[1]];
  for(const [name, code] of Object.entries(COUNTRY_NAME_ALIASES)){
    if(clean.includes(name)) return code;
  }
  return null;
}

// Fecha del chart, sacada del nombre del archivo.
// Spotify: regional-uy-weekly-2024-01-04.csv
// YouTube: youtube-charts-top-songs-uy-weekly-20240104.csv
function detectDateFromFilename(filename){
  if(!filename) return null;
  let m = filename.match(/(20\d{2})-(\d{2})-(\d{2})/);
  if(m) return `${m[1]}-${m[2]}-${m[3]}`;
  m = filename.match(/(20\d{2})(\d{2})(\d{2})/);
  if(m) return `${m[1]}-${m[2]}-${m[3]}`;
  return null;
}

function detectFormat(row, filename){
  if('track_artist_concat' in row && 'tempo_id' in row) return 'master_tempo';
  if('perf_pc' in row || 'mech_pc' in row || 'estado_obra' in row) return 'tempo_report';
  if('mech_bo' in row || 'bo_status' in row || 'reclamos' in row || 'ca' in row) return 'bo_report';
  if('track_name' in row && 'artist_names' in row){
    // La plataforma se decide primero por el nombre del archivo y la URI,
    // que son señales fiables; "weekly_growth" queda como último recurso
    // porque no todos los export de YouTube traen esa columna.
    const fname = (filename || '').toLowerCase();
    const uri = String(row.uri || '').toLowerCase();
    if(fname.includes('youtube') || uri.includes('youtube.com') || uri.includes('youtu.be')) return 'youtube';
    if(fname.includes('spotify') || uri.startsWith('spotify:')) return 'spotify';
    return 'weekly_growth' in row ? 'youtube' : 'spotify';
  }
  return null;
}

// Procesa varios CSV en secuencia (uno detrás de otro, no en paralelo,
// para que no se pisen entre ellos al crear las mismas canciones).
// Cada archivo queda en state.uploadQueue con su estado (pendiente, cargando, listo) y su resultado.
async function handleFiles(fileList){
  const files = Array.from(fileList || []);
  if(!files.length) return;
  state.uploadQueue = files.map(f => ({ filename: f.name, result: null }));
  state.uploading = true;
  render();

  for(let i = 0; i < files.length; i++){
    state.uploadIndex = i;
    render();
    await handleCsv(files[i]);
  }

  state.uploading = false;
  state.uploadIndex = -1;
  await loadLastChartLoad();
  loadAll();
}

// Lee el CSV respetando el encoding real. Muchos export vienen en
// Windows-1252 (Excel en español): si se leen como UTF-8, los caracteres
// como "¿" o "ñ" se rompen. Si detectamos el carácter de reemplazo,
// releemos el archivo con el otro encoding.
async function readFileText(file){
  const buf = await file.arrayBuffer();
  let text = new TextDecoder('utf-8').decode(buf);
  if(text.includes('\uFFFD')){
    try { text = new TextDecoder('windows-1252').decode(buf); } catch(e){ /* se deja el UTF-8 */ }
  }
  return text;
}

// Los CSV viejos de Spotify Charts traen una primera línea de aviso ("Note that these figures are generated
// using a formula...") antes de los encabezados: se saltea.
function quitarNotaInicial(text){
  return /^\uFEFF?\s*"?note that/i.test(text) ? text.slice(text.indexOf('\n') + 1) : text;
}

function handleCsv(file){
  return new Promise(async (resolve) => {
    let text;
    try { text = quitarNotaInicial(await readFileText(file)); }
    catch(err){ await cargarArchivo(file, 0, [], [`No se pudo leer el archivo: ${err}`], null, null); return resolve(); }

    Papa.parse(text, {
      header:true, skipEmptyLines:true,
      transformHeader: canonicalHeader,
      complete: async (res) => {
        try {
          if(!res.data.length){
            await cargarArchivo(file, 0, [], ['CSV vacío'], null, null);
            return resolve();
          }
          const format = detectFormat(res.data[0], file.name);

          if(format === 'master_tempo'){
            await processMasterTempoCsv(file, res.data);
          } else if(format === 'tempo_report'){
            await processTempoReportCsv(file, res.data);
          } else if(format === 'bo_report'){
            const pais = detectCountryFromFilename(file.name) || state.controlCountry;
            if(!pais){
              await cargarArchivo(file, res.data.length, [],
                ['No se pudo determinar el país: el nombre del archivo no lo indica y no se seleccionó uno en la pantalla de carga.'],
                format, null);
            } else {
              await processBoReportCsv(file, res.data, pais);
            }
          } else if(format === 'spotify' || format === 'youtube'){
            await processRankingCsv(file, res.data, format);
          } else {
            await cargarArchivo(file, res.data.length, [],
              ['No se reconoce el formato del CSV.'], null, null);
          }
        } catch (err) {
          await cargarArchivo(file, 0, [], [String(err)], null, null);
        }
        resolve();
      }
    });
  });
}

// Números enteros de los charts (posiciones, semanas, streams/vistas). Acepta separador de miles ("1,234,567" o
// "1.234.567", por ejemplo si el archivo pasó por Excel) y decimales ("12.0"). "--", "NEW" o vacío: sin dato.
function entero(v){
  const t = String(v ?? '').trim().replace(/\s/g, '');
  if(/^\d{1,3}([.,]\d{3})+$/.test(t)) return t.replace(/[.,]/g, '');
  const m = t.match(/^(\d+)([.,]\d+)?$/);
  return m ? m[1] : null;
}

async function processRankingCsv(file, rows, format){
  const prepared = [];
  let errors = [];

  // El país sale del nombre del archivo (vale para Spotify y para
  // YouTube). Si el archivo no lo trae en el nombre, se usa la columna
  // Source.Name fila por fila, para los export viejos que sí la tenían.
  const fileCountry = detectCountryFromFilename(file.name) || detectCountry(file.name);
  if(!fileCountry && !('source_name' in rows[0])){
    await cargarArchivo(file, rows.length, [],
      [`No se pudo determinar el país: el nombre "${file.name}" no lo incluye y el archivo no trae columna Source.Name.`],
      format, null);
    return;
  }

  // Semana del chart: del nombre del archivo. Sin semana no se carga (la fecha del día daría una semana equivocada).
  const fileDate = detectDateFromFilename(file.name);
  if(!fileDate){
    await cargarArchivo(file, rows.length, [],
      [`El nombre "${file.name}" no indica la semana del chart (por ejemplo 2024-01-04): no se cargó.`], format, fileCountry);
    return;
  }

  for(const row of rows){
    // Solo el título es obligatorio. Si falta el artista (pasa en algunos
    // videos de YouTube), la base lo guarda como "Sin artista".
    const trackName = row.track_name?.trim();
    const artistNames = row.artist_names?.trim() || '';
    if(!trackName){ errors.push('Fila sin título'); continue; }

    const pais = fileCountry || detectCountry(row.source_name);
    if(!pais){ errors.push(`No se pudo determinar país en: ${row.source_name || '(sin Source.Name)'}`); continue; }

    let weeklyGrowth = null;
    if(row.weekly_growth){
      const n = parseFloat(String(row.weekly_growth).replace('%','').replace(',','.'));
      if(!isNaN(n)) weeklyGrowth = n;
    }

    prepared.push({
      track_name: trackName, artist_names: artistNames, pais_code: pais,
      rank: entero(row.rank), peak_rank: entero(row.peak_rank), previous_rank: entero(row.previous_rank),
      weeks_on_chart: entero(row.weeks_on_chart), streams: entero(row.streams),
      source: row.source || null, uri: row.uri || null, weekly_growth: weeklyGrowth,
      snapshot_date: fileDate,
    });
  }

  await cargarArchivo(file, rows.length, prepared, errors, format, fileCountry, fileDate);
}

async function processMasterTempoCsv(file, rows){

async function processTempoReportCsv(file, rows){
  const prepared = [];

    prepared.push({

      mech_pc: row.mech_pc ? String(row.mech_pc).replace('%','').replace(',','.') : null,
      sync_pc: row.sync_pc ? String(row.sync_pc).replace('%','').replace(',','.') : null,

}

async function processBoReportCsv(file, rows, pais){

// Supabase Storage no admite acentos ni caracteres especiales en la
// ruta. Se limpia solo para guardar; el nombre original se conserva en
// csv_uploads.filename, que es lo que se muestra en el historial.
function sanitizeStorageName(name){
  return stripAccents(name)
    .replace(/[^a-zA-Z0-9._-]+/g, '_')
    .replace(/_+/g, '_')
    .replace(/^_|_$/g, '') || 'archivo.csv';
}

// Carpeta donde se archiva cada tipo de CSV dentro del bucket.
// Los que corresponden a un solo país se guardan por país; los que
// mezclan países (Reporte Tempo) o no aplican, por fecha.
function storageFolder(format, pais){
  const hoy = new Date().toISOString().slice(0,10);
  const p = pais || 'sin_pais';   // el historial de cargas lee el país de esta carpeta
  switch(format){
    case 'spotify':      return `spotify/${p}/${hoy}`;
    case 'youtube':      return `youtube/${p}/${hoy}`;
    case 'bo_report':    return `bo_report/${p}/${hoy}`;
    case 'tempo_report': return `tempo_report/${hoy}`;
    case 'master_tempo': return `tempo_ids/${hoy}`;
    default:             return `otros/${hoy}`;
  }
}

// Guarda el archivo original y después carga sus filas y lo registra en el historial en una sola operación de la base
// (fn_cargar_archivo): queda todo o no queda nada. Sin el archivo original no se carga ningún dato.
async function cargarArchivo(file, total, filas, errors, format, pais, semana){
  const item = state.uploadQueue[state.uploadIndex];
  const resultado = (updated, created_tracks, errs) => {
    if(item) item.result = { format, pais, semana, total, updated, created_tracks, errors: errs };
  };
  const storagePath = `${storageFolder(format, pais)}/${Date.now()}_${sanitizeStorageName(file.name)}`;
  const { error: upErr } = await sb.storage.from('csv-uploads').upload(storagePath, file);
  if(upErr){ resultado(0, 0, [...errors, `No se cargó: no se pudo guardar el archivo original (${upErr.message}).`]); return; }
  const { data, error } = await sb.rpc('fn_cargar_archivo', {
    p_formato: format || null, p_filas: filas, p_archivo: file.name, p_ruta: storagePath, p_total: total,
    p_pais: format === 'bo_report' ? pais : null, p_errores: errors,
  });
  if(error){ resultado(0, 0, [...errors, `No se cargó ninguna fila: ${error.message}`]); return; }
  resultado(data.updated, data.created_tracks, data.errors);
}

async function guardarClaveIngreso(){
  const v = (id) => (document.getElementById(id) || {}).value || '';
  const email = v('loginEmail').trim(), nueva = v('claveNueva');
  const error = (msg) => { document.getElementById('loginErr').textContent = msg; };
  if(!email) return error('Ingresá el email.');
  if(nueva.length < 10) return error('La contraseña nueva debe tener al menos 10 caracteres.');
  if(nueva !== v('claveRepetir')) return error('Las contraseñas nuevas no coinciden.');
  const boton = document.getElementById('claveGuardar'); boton.disabled = true;
  const r = state.loginModo === 'cambiar'
    ? await sb.auth.cambiarClave(email, v('claveActual'), nueva)
    : await sb.auth.restablecerClave(email, v('claveCodigo'), nueva);
  boton.disabled = false;
  if(r.error) return error(r.error.message);
  Object.assign(state, { loginModo: 'ingresar', loginError: '', loginEmailValor: email,
                         loginAviso: 'La contraseña quedó guardada. Ingresá con la contraseña nueva.' });
  render();
}

// ---------- Historial de cargas (solo lectura) ----------
// Muestra lo que hay cargado en el sistema y de qué archivo salió. No descarga ni borra nada.
const HIST_TABS = [['youtube','YouTube'], ['spotify','Spotify'], ['bo','Reportes BackOffice'], ['tempo','Reportes Tempo Control']];

async function loadHistorial(){
  const PAGE = 50000;   // la API propia no tiene el límite de 1.000 filas de Supabase: menos vueltas, sin recalcular
  const uploads = [];
  for(let from = 0; ; from += PAGE){
    const { data, error } = await sb.from('csv_uploads')
      .select('id,filename,uploaded_by,uploaded_at,total_rows,updated_rows,created_tracks,error_count,file_path,format')
      .order('uploaded_at', { ascending: false }).range(from, from + PAGE - 1);
    if(error){ console.error('csv_uploads:', error.message); break; }
    uploads.push(...(data || []));
    if(!data || data.length < PAGE) break;
  }
  const [charts, reportes, usuarios] = await Promise.all([
    fetchAll('fn_historial_charts', {}), fetchAll('fn_historial_reportes', {}), fetchAll('fn_nombres_usuarios', {}),
  ]);
  state.historial = {
    uploads: uploads.map(u => ({ ...u, tipo: tipoCarga(u), pais: paisCarga(u), semana: semanaCarga(u) })).filter(u => u.tipo),
    charts: charts.data || [], reportes: reportes.data || [],
    usuarios: Object.fromEntries((usuarios.data || []).map(x => [x.id, x.email])),
  };
  if(state.activeTab === 'history') render();
}

// En qué pestaña del historial va cada archivo. Las descargas (reporte BO y CSV generados) no son cargas.
function tipoCarga(u){
  const n = (u.filename || '').toLowerCase();
  switch(u.format){
    case 'youtube': case 'spotify': return u.format;
    case 'bo_report': return 'bo';
    case 'tempo_report': case 'master_tempo': return 'tempo';
    case 'bo_generado': case 'csv_principal': return null;
  }
  // Cargas viejas sin tipo registrado: se reconocen por el nombre.
  if(n.includes('youtube')) return 'youtube';
  if(n.startsWith('regional') || n.includes('spotify')) return 'spotify';
  if(n.includes('pais_') || /(^|[^a-z])bo([^a-z]|$)/.test(n) || n.includes('backoffice')) return 'bo';
  if(n.includes('tempo')) return 'tempo';
  // Un archivo que no se reconoció no cargó nada: no es parte de lo que hay en el sistema.
  return u.updated_rows ? 'otros' : null;
}
function paisCarga(u){
  const carpeta = (u.file_path || '').split('/')[1];
  if(COUNTRIES.includes(carpeta)) return carpeta;
  return detectCountryFromFilename(u.filename) || detectCountry(u.filename) || null;
}
function semanaCarga(u){
  return detectDateFromFilename(u.filename) || (u.uploaded_at || '').slice(0, 10);
}
function quien(id){
  const email = state.historial?.usuarios?.[id];
  if(email) return email.split('@')[0];
  // Cargas hechas fuera de la aplicación (por ejemplo "importación histórica") guardan un nombre en lugar del usuario.
  return id && !/^[0-9a-f-]{36}$/.test(id) ? id : '—';
}
function fechaCarga(u){ return fmtFecha(u.uploaded_at); }

function renderHistory(){
  const h = state.historial;
  if(!h) return `<div class="empty">Cargando…</div>`;
  const cuenta = (t) => h.uploads.filter(u => u.tipo === t).length;
  const tabs = [...HIST_TABS, ...(cuenta('otros') ? [['otros', 'Otras cargas']] : [])];
  if(!tabs.some(([k]) => k === state.histTab)) state.histTab = 'youtube';
  const t = state.histTab;
  return `
  <p class="hist-nota">Archivos cargados en el sistema.</p>
  <div class="subtabs">${tabs.map(([k, l]) =>
    `<button class="subtab ${t===k?'active':''}" data-hist-tab="${k}">${l}<span class="cnt">${cuenta(k)}</span></button>`).join('')}</div>
  ${t === 'youtube' || t === 'spotify' ? renderHistCharts(t)
    : t === 'bo' ? renderHistReportes('bo')
    : t === 'tempo' ? renderHistReportes('tempo')
    : renderArchivos(h.uploads.filter(u => u.tipo === 'otros'), false)}`;
}

function filaArchivo(u, conTipo, conPais){
  return `<tr>
    ${conTipo ? `<td>${TIPOS_CARGA[u.format] || '—'}</td>` : ''}
    <td>${u.filename}</td>
    ${conPais ? `<td class="mono">${u.pais || (u.format === 'tempo_report' ? 'varios' : '—')}</td>` : ''}
    <td class="mono">${fechaCarga(u)}</td><td>${quien(u.uploaded_by)}</td>
    <td class="num">${fmtNum(u.total_rows)}</td><td class="num">${fmtNum(u.updated_rows)}</td>
    <td class="num">${u.error_count ? `<span class="badge dup">${u.error_count}</span>` : '0'}</td>
  </tr>`;
}
function renderArchivos(lista, conTipo, conPais = true){
  if(!lista.length) return `<div class="empty">No hay archivos cargados.</div>`;
  return `<table><thead><tr>${conTipo ? '<th>Tipo</th>' : ''}<th>Archivo</th>${conPais ? '<th>País</th>' : ''}
    <th>Cargado el</th><th>Por</th><th class="num">Filas</th><th class="num">Cargadas</th><th class="num">Errores</th></tr></thead>
    <tbody>${lista.map(u => filaArchivo(u, conTipo, conPais)).join('')}</tbody></table>`;
}

function renderHistCharts(plataforma){
  const h = state.historial;
  const semanas = h.charts.filter(c => c.platform === plataforma);
  const archivos = h.uploads.filter(u => u.tipo === plataforma);
  const pais = state.histPais;
  const chips = `<div class="chips">
    <button class="chip ${!pais?'active':''}" data-hist-pais="">Todos</button>
    ${COUNTRIES.map(c => { const n = semanas.filter(x => x.pais_code === c).length;
      return `<button class="chip ${pais===c?'active':''}" data-hist-pais="${c}" ${n ? '' : 'disabled'}>${c}</button>`; }).join('')}
  </div>`;
  if(!pais){
    const filas = COUNTRIES.map(c => {
      const s = semanas.filter(x => x.pais_code === c);
      if(!s.length) return '';
      const fechas = s.map(x => x.snapshot_date).sort();
      return `<tr class="clic" data-hist-pais="${c}">
        <td class="mono">${c}</td><td class="num">${s.length}</td>
        <td class="mono">${fechas[0]}</td><td class="mono">${fechas[fechas.length-1]}</td>
        <td class="num">${archivos.filter(u => u.pais === c).length}</td></tr>`;
    }).join('');
    const sinPais = archivos.filter(u => !u.pais);
    return chips + (filas ? `<table><thead><tr><th>País</th><th class="num">Semanas cargadas</th><th>Primera semana</th>
        <th>Última semana</th><th class="num">Archivos</th></tr></thead><tbody>${filas}</tbody></table>
        <p class="hist-nota" style="margin-top:8px">Seleccioná un país para ver el detalle por semana y su archivo de origen.</p>`
      : `<div class="empty">No hay charts de ${plataforma === 'youtube' ? 'YouTube' : 'Spotify'} cargados.</div>`)
      + (sinPais.length ? `<div class="hist-sec">Archivos sin territorio en el nombre</div>${renderArchivos(sinPais, false, false)}` : '');
  }
  const deEse = archivos.filter(u => u.pais === pais);
  const usados = new Set();
  const filas = semanas.filter(x => x.pais_code === pais).map(x => {
    const fs = deEse.filter(u => u.semana === x.snapshot_date);
    fs.forEach(u => usados.add(u.id));
    const u = fs[0];
    return `<tr><td class="mono">${x.snapshot_date}</td><td class="num">${fmtNum(x.canciones)}</td>
      <td>${fs.length ? fs.map(f => f.filename).join('<br>') : '<span class="tempo">Archivo no registrado</span>'}</td>
      <td class="mono">${u ? fechaCarga(u) : '—'}</td><td>${u ? quien(u.uploaded_by) : '—'}</td>
      <td class="num">${u ? (u.error_count ? `<span class="badge dup">${u.error_count}</span>` : '0') : '—'}</td></tr>`;
  }).join('');
  const otros = deEse.filter(u => !usados.has(u.id));
  return chips + `<table><thead><tr><th>Semana</th><th class="num">Canciones</th><th>Archivo</th><th>Cargado el</th>
      <th>Por</th><th class="num">Errores</th></tr></thead><tbody>${filas}</tbody></table>`
    + (otros.length ? `<div class="hist-sec">Otros archivos de ${pais} sin semana cargada</div>${renderArchivos(otros, false, false)}` : '');
}

function renderHistReportes(tipo){
  const h = state.historial;
  const res = h.reportes.filter(r => r.tipo === tipo);
  const archivos = h.uploads.filter(u => u.tipo === tipo);
  const nombre = tipo === 'bo' ? 'datos del Reporte BackOffice' : 'datos del Reporte Tempo Control';
  const tids = h.reportes.find(r => r.tipo === 'tempo_ids');
  return `
    ${tipo === 'tempo' && tids ? `<p class="hist-nota">Obras de la tabla principal con Tempo ID: <b>${fmtNum(tids.obras)}</b>.</p>` : ''}
    ${res.length ? `<table><thead><tr><th>País</th><th class="num">Obras con ${nombre}</th><th>Última actualización</th></tr></thead>
      <tbody>${res.map(r => `<tr><td class="mono">${r.pais_code}</td><td class="num">${fmtNum(r.obras)}</td>
        <td class="mono">${fmtFecha(r.actualizado)}</td></tr>`).join('')}</tbody></table>`
      : `<div class="empty">No hay ${nombre} cargados.</div>`}
    <div class="hist-sec">Archivos cargados</div>
    ${renderArchivos(archivos, tipo === 'tempo', tipo === 'bo')}`;
}

// ---------- Panel de control ----------
// Solo para las personas con acceso (lo decide la base; la API lo verifica en cada pedido). Se abre en una pestaña
// propia y no cambia nada de las demás.
const PANEL_SUBS = [['estado', 'Estado del sistema'], ['respaldos', 'Respaldos y OneDrive'], ['usuarios', 'Usuarios'],
  ['actividad', 'Actividad'], ['integridad', 'Integridad de datos'], ['registro', 'Registro del servidor']];
const SERVICIOS = {
  espejo: 'Espejo de OneDrive', respaldo: 'Respaldos', instalador: 'Actualización de la base',
};
let relojPanel = null;

function esc(t){
  return String(t ?? '').replace(/[&<>"']/g, c => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c]));
}
function fmtBytes(n){
  if(n === null || n === undefined) return '—';
  const u = ['B', 'KB', 'MB', 'GB', 'TB']; let i = 0; n = Number(n);
  while(n >= 1024 && i < u.length - 1){ n /= 1024; i++; }
  return `${n.toLocaleString('es-AR', { maximumFractionDigits: i ? 1 : 0 })} ${u[i]}`;
}
function haceCuanto(seg){
  if(seg === null || seg === undefined) return '—';
  if(seg < 60) return `hace ${seg} s`;
  if(seg < 3600) return `hace ${Math.round(seg / 60)} min`;
  if(seg < 86400) return `hace ${Math.round(seg / 3600)} h`;
  return `hace ${Math.round(seg / 86400)} días`;
}

async function loadPanelAcceso(){
  const r = await sb.panel.get('acceso');
  state.panel.acceso = !!(r.data && r.data.acceso);
}

async function loadPanel(sub){
  const p = state.panel;
  sub = sub || p.sub;
  const pedir = {
    estado: () => sb.panel.get('estado'),
    respaldos: async () => {
      const [e, ev] = await Promise.all([sb.panel.get('estado'), sb.panel.get('eventos', { servicio: p.eventoServicio, limite: 200 })]);
      return { data: e.data && { estado: e.data, eventos: ev.data || [] }, error: e.error || ev.error };
    },
    usuarios: () => sb.panel.get('usuarios'),
    actividad: () => sb.panel.get('actividad', p.filtrosAct),
    integridad: () => sb.panel.get('integridad'),
    registro: () => sb.panel.get('registro'),
  }[sub];
  const r = await pedir();
  if(r.error){ p.error = r.error.message; return; }
  p.error = '';
  p.datos[sub] = r.data;
  p.actualizado = new Date();
}

// El estado se actualiza solo mientras la pestaña está abierta.
function programarPanel(){
  clearInterval(relojPanel);
  if(state.activeTab === 'panel' && ['estado', 'respaldos'].includes(state.panel.sub)){
    relojPanel = setInterval(async () => {
      if(state.activeTab !== 'panel' || document.hidden || state.panel.ocupado) return;
      const activo = document.activeElement && document.activeElement.id;
      await loadPanel(); if(state.activeTab === 'panel' && !activo?.startsWith('panel')) render();
    }, 15000);
  }
}

function punto(estado){ return `<span class="punto ${estado}"></span>`; }

function renderPanel(){
  const p = state.panel;
  const d = p.datos[p.sub];
  const cuerpo = !d ? `<div class="empty">${p.error ? esc(p.error) : 'Cargando…'}</div>` : ({
    estado: renderPanelEstado, respaldos: renderPanelRespaldos, usuarios: renderPanelUsuarios,
    actividad: renderPanelActividad, integridad: renderPanelIntegridad, registro: renderPanelRegistro,
  })[p.sub](d);
  return `
  <div class="subtabs">${PANEL_SUBS.map(([k, l]) =>
    `<button class="subtab ${p.sub === k ? 'active' : ''}" data-panel-sub="${k}">${l}</button>`).join('')}
    <button class="btn panel-actualizar" id="panelActualizar">Actualizar</button>
    <span class="panel-hora">${p.actualizado ? 'Actualizado ' + p.actualizado.toLocaleTimeString('es-AR') : ''}</span>
  </div>
  ${p.error && d ? `<div class="aviso-panel error">${esc(p.error)}</div>` : ''}
  ${p.mensaje ? `<div class="aviso-panel">${p.mensaje}</div>` : ''}
  ${cuerpo}
  ${renderPanelCodigo()}`;
}

function tarjeta(titulo, contenido, extra = ''){
  return `<div class="tarjeta ${extra}"><h3>${titulo}</h3>${contenido}</div>`;
}
function fila(k, v){ return `<div class="dato"><span>${k}</span><b>${v}</b></div>`; }
function barra(usado, total){
  if(!total) return '';
  const pc = Math.round(100 * usado / total);
  return `<div class="barra-uso ${pc >= 90 ? 'alta' : pc >= 75 ? 'media' : ''}"><div style="width:${pc}%"></div></div>`;
}

function estadoServicio(s, limite){
  if(!s) return ['apagado', 'Sin datos'];
  if(s.detalle && s.detalle.apagado) return ['apagado', 'Sin configurar'];
  return s.segundos <= limite ? ['ok', 'Funcionando'] : ['error', 'Sin respuesta'];
}

function renderPanelEstado(e){
  const sv = e.servicios || {}, r = e.recursos || {}, dt = e.datos || {};
  const servicios = [
    ['Base de datos', 'ok', 'Funcionando', `PostgreSQL ${esc((e.base.version || '').split(' ')[0])} · iniciada ${fmtFecha(e.base.iniciada)}`],
    ['API y aplicación', 'ok', 'Funcionando', `iniciada ${fmtFecha(e.api.iniciada)}${e.api.fallas_recientes ? ` · ${e.api.fallas_recientes} errores en el registro` : ''}`
      + (e.ultimo_arranque ? `<br>Último arranque (${fmtFecha(e.ultimo_arranque.fecha)}): ${esc(e.ultimo_arranque.mensaje.replace(/^Arranque del sistema: /, ''))}` : '')],
    ...['espejo', 'respaldo'].map(k => {
      const [cl, tx] = estadoServicio(sv[k], 120);
      const det = sv[k] ? (k === 'espejo'
        ? (sv[k].detalle.apagado ? 'Sin carpeta de OneDrive configurada'
           : `${sv[k].detalle.onedrive_disponible ? 'Carpeta disponible' : 'Carpeta de OneDrive no disponible'} · último aviso ${haceCuanto(sv[k].segundos)}`)
        : (sv[k].detalle.apagado ? 'Sin carpeta de respaldos' : `Último aviso ${haceCuanto(sv[k].segundos)}`)) : 'El servicio todavía no informó su estado';
      const clase = k === 'espejo' && sv[k] && sv[k].detalle.onedrive_disponible === false && cl === 'ok' ? 'aviso' : cl;
      return [SERVICIOS[k], clase, clase === 'aviso' ? 'Con avisos' : tx, det];
    }),
    ['Actualización de la base', sv.instalador ? 'ok' : 'apagado', sv.instalador ? 'Aplicada' : 'Sin datos',
      sv.instalador ? `${fmtFecha(sv.instalador.ultimo_aviso)} · ${sv.instalador.detalle.mejoras || 0} mejoras propias` : ''],
  ];
  const mem = r.memoria, disco = r.disco;
  return `
  <div class="tarjetas">
    ${tarjeta('Servicios', servicios.map(([n, cl, tx, det]) =>
      `<div class="servicio" data-servicio="${esc(n)}">${punto(cl)}<div><b>${n}</b> <span class="estado-${cl}">${tx}</span>
        <div class="det">${det}</div></div></div>`).join(''), 'ancha')}
    ${tarjeta('Recursos de la computadora', `
      ${disco ? fila('Disco', `${fmtBytes(disco.usado)} de ${fmtBytes(disco.total)} · libre ${fmtBytes(disco.libre)}`) + barra(disco.usado, disco.total) : ''}
      ${mem ? fila('Memoria', `${fmtBytes(mem.total - mem.disponible)} de ${fmtBytes(mem.total)}`) + barra(mem.total - mem.disponible, mem.total) : ''}
      ${r.carga ? fila('Uso del procesador', `${Math.min(100, Math.round(100 * r.carga[0] / (r.cpus || 1)))} % (${r.cpus} núcleos)`) : ''}
      ${fila('Base de datos', fmtBytes(e.base.tamano))}
      ${fila('Archivos cargados', `${fmtNum(dt.archivos)} · ${fmtBytes(dt.tamano_archivos)}`)}`)}
    ${tarjeta('Contenido', `
      ${fila('Obras', fmtNum(dt.obras))}
      ${fila('Obras sin Tempo ID', fmtNum(dt.obras_sin_tempo))}
      ${fila('Filas de charts', fmtNum(dt.filas_charts))}
      ${fila('Registros de Reporte BackOffice', fmtNum(dt.reportes_bo))}
      ${fila('Registros de Reporte Tempo Control', fmtNum(dt.reportes_tempo))}`)}
    ${tarjeta('Respaldos', renderResumenRespaldos(e))}
  </div>
  <p class="nota-panel">Acceso al Panel de control: ${(e.acceso || []).map(esc).join(', ')}. Se administra desde la
  consola (opción 7 de <code>bash ranking.sh usuarios</code>).</p>`;
}

function renderResumenRespaldos(e){
  const rs = e.respaldos || {}, det = (e.servicios.respaldo || {}).detalle || {};
  const ev = (x) => x ? `${fmtFecha(x.fecha)}<div class="det">${esc(x.mensaje)}</div>` : 'Sin registro';
  return `${fila('Último respaldo', ev(rs.ultimo_respaldo))}
    ${fila('Última copia en OneDrive', ev(rs.ultima_copia_onedrive))}
    ${det.cada_horas !== undefined ? fila('Respaldo automático', det.cada_horas ? `cada ${det.cada_horas} h · se conservan ${det.conservar}` : 'Apagado') : ''}

async function accionUsuario(accion, email, extra = {}){
  const p = state.panel;
  if(accion === 'bloquear' && !confirm(`¿Bloquear a ${email}? Se cierran sus sesiones y no podrá ingresar hasta que se lo desbloquee.`)) return;
  p.ocupado = true;
  const r = await sb.panel.post('usuarios', { accion, email, ...extra });
  p.ocupado = false;
  if(r.error){ alert(r.error.message); }
  else if(accion === 'crear' || accion === 'codigo'){ p.codigo = { email, codigo: r.data.resultado, alta: accion === 'crear' }; }
  else p.mensaje = ({ bloquear: `${esc(email)} quedó bloqueado.`, desbloquear: `${esc(email)} quedó desbloqueado.`,
    cerrar_sesiones: `Se cerraron las sesiones de ${esc(email)}.`, rol: `Se actualizó el rol de ${esc(email)}.` })[accion] || '';
  await loadPanel('usuarios'); render();
}

function attachPanelEvents(){
  const p = state.panel;
  document.querySelectorAll('[data-panel-sub]').forEach(b => b.onclick = async () => {
    p.sub = b.dataset.panelSub; p.mensaje = ''; render();
    if(p.sub === 'actividad' && !p.datos.usuarios) await loadPanel('usuarios');
    await loadPanel(); render(); programarPanel();
  });
  const act = document.getElementById('panelActualizar');
  if(act) act.onclick = async () => { await loadPanel(); render(); };
  const resp = document.getElementById('panelRespaldar');
  if(resp) resp.onclick = async () => {
    resp.disabled = true;
    const r = await sb.panel.post('respaldo');
    p.mensaje = r.error ? '' : 'Respaldo solicitado. En unos segundos figura en el registro.';
    if(r.error) alert(r.error.message);
    await loadPanel(); render();
  };
  const evs = document.getElementById('panelEventoServicio');
  if(evs) evs.onchange = async () => { p.eventoServicio = evs.value; await loadPanel(); render(); };
  const crear = document.getElementById('panelCrear');
  if(crear) crear.onclick = () => {
    const email = document.getElementById('panelNuevoEmail').value.trim();
    if(!email) return alert('Ingresá el email del usuario.');
    accionUsuario('crear', email, { rol: 'usuario_estandar',
                                    oficina: document.getElementById('panelNuevaOficina').value.trim() || null });
  };
  document.querySelectorAll('[data-usuario-accion]').forEach(b => b.onclick = () => accionUsuario(b.dataset.usuarioAccion, b.dataset.email));
  const cambiarOficina = (email) => accionUsuario('rol', email, {
    rol: (p.datos.usuarios || []).find(u => u.email === email)?.rol || 'usuario_estandar',
    oficina: document.querySelector(`[data-usuario-oficina="${CSS.escape(email)}"]`).value.trim() || null });
  document.querySelectorAll('[data-usuario-oficina]').forEach(i => i.onchange = () => cambiarOficina(i.dataset.usuarioOficina));
  const filtros = { panelActUsuario: 'usuario', panelActTipo: 'tipo', panelActDesde: 'desde', panelActHasta: 'hasta' };
  Object.entries(filtros).forEach(([id, k]) => {
    const el = document.getElementById(id);
    if(el) el.onchange = async () => { p.filtrosAct[k] = el.value || null; await loadPanel(); render(); };
  });
  const cerrar = () => { p.codigo = null; render(); };
  const cc = document.getElementById('closeCodigo'); if(cc) cc.onclick = cerrar;
  const cb = document.getElementById('codigoBg'); if(cb) cb.onclick = (e) => { if(e.target === cb) cerrar(); };
}

function renderBody(){
  if(state.activeTab==='master') return renderMaster();
  if(state.activeTab==='territory') return renderTerritory();
  if(state.activeTab==='upload') return renderUpload();
  if(state.activeTab==='history') return renderHistory();
  if(state.activeTab==='panel') return renderPanel();
}

function render(){
  const root = document.getElementById('root');
  if(!state.session){ root.innerHTML = renderLogin(); attachLoginEvents(); return; }
  root.innerHTML = `<div class="app">
    ${renderTopbar()}${renderTabs()}
    <div class="panel-body">${renderBody()}</div>
    <footer><span>Auditor de Rankings Digitales</span><span>${rows_count()}</span></footer>
  </div>${renderHistoryModal()}${renderEnvioDialog()}`;
  attachAppEvents();
  if(state.activeTab === 'panel') attachPanelEvents();
}
function rows_count(){
  if(state.activeTab==='master') return `${fmtNum(state.masterTotal)} canciones`;
  if(state.activeTab==='territory') return `${fmtNum(state.territoryTotal)} registros de territorio`;
  return '';
}

function attachLoginEvents(){
  const ingresar = document.getElementById('loginBtn');
  if(ingresar) ingresar.onclick = () => {
    doLogin(document.getElementById('loginEmail').value, document.getElementById('loginPass').value);
  };

  if(guardar) guardar.onclick = guardarClaveIngreso;
  document.querySelectorAll('[data-login-modo]').forEach(a => a.onclick = () => {
    Object.assign(state, { loginModo: a.dataset.loginModo, loginError: '', loginAviso: '',
                           loginEmailValor: document.getElementById('loginEmail').value });

}

function attachAppEvents(){
  document.getElementById('logoutBtn').onclick = doLogout;
  document.querySelectorAll('[data-tab]').forEach(t => t.onclick = async () => {
    const habiaBusqueda = !!state.search;
    state.activeTab = t.dataset.tab; state.search='';
    if(!state.uploading) state.uploadQueue = [];
    if(state.activeTab === 'history' && !state.historial) loadHistorial();
    programarPanel();
    if(state.activeTab === 'panel'){ state.panel.mensaje = ''; loadPanel().then(() => { if(state.activeTab === 'panel') render(); }); }
    render();
    // La búsqueda es de cada pestaña: al cambiar, se vuelve a pedir la página sin búsqueda.
    if(state.activeTab === 'master' && habiaBusqueda){ state.masterPage = 0; await loadMaster(); render(); }
    if(state.activeTab === 'territory' && (state.territoryStale || habiaBusqueda)){ state.territoryPage = 0; await loadTerritory(); render(); }
  });
  document.querySelectorAll('[data-pager]').forEach(b => b.onclick = async () => {
    const dir = Number(b.dataset.dir);
    if(b.dataset.pager === 'master'){ state.masterPage = Math.max(0, state.masterPage + dir); await loadMaster(); }
    else { state.territoryPage = Math.max(0, state.territoryPage + dir); await loadTerritory(); }
    render();
    window.scrollTo(0, 0);
  });
  document.querySelectorAll('[data-hist-tab]').forEach(b => b.onclick = () => { state.histTab = b.dataset.histTab; state.histPais = ''; render(); });
  document.querySelectorAll('[data-hist-pais]').forEach(b => b.onclick = () => { state.histPais = b.dataset.histPais; render(); });

  const sM = document.getElementById('searchMaster');
  if(sM) sM.oninput = (e) => buscar(e.target.value, 'searchMaster');
  const sT = document.getElementById('searchTerritory');
  if(sT) sT.oninput = (e) => buscar(e.target.value, 'searchTerritory');

  const cf = document.getElementById('countryFilter');
  if(cf) cf.onchange = (e) => { state.territoryCountry = state.lastCountry = e.target.value; loadAll(); };
  const mc = document.getElementById('masterCountry');
  if(mc) mc.onchange = (e) => { state.masterCountry = state.lastCountry = e.target.value; loadAll(); };

  ['dateFrom','dateFromT'].forEach(id => {
    const el = document.getElementById(id);
    if(el) el.onchange = (e) => { state.dateFrom = e.target.value; loadAll(); };
  });
  ['dateTo','dateToT'].forEach(id => {
    const el = document.getElementById(id);
    if(el) el.onchange = (e) => { state.dateTo = e.target.value; loadAll(); };
  });
  ['clearFilters','clearFiltersT'].forEach(id => {
    const el = document.getElementById(id);
    if(el) el.onclick = () => { state.dateFrom=''; state.dateTo=''; state.masterCountry=''; loadAll(); };
  });
  const rf = document.getElementById('reclamosFilter');
  if(rf) rf.onchange = async (e) => { state.reclamosFilter = e.target.value; state.territoryPage = 0; await loadTerritory(); render(); };
  const etf = document.getElementById('estadoTrabajoFilter');
  if(etf) etf.onchange = async (e) => { state.estadoTrabajoFilter = e.target.value; state.territoryPage = 0; await loadTerritory(); render(); };
  const cc = document.getElementById('controlCountry');
  if(cc) cc.onchange = (e) => { state.controlCountry = e.target.value; };


  document.querySelectorAll('[data-field-master]').forEach(el => {
    const handler = () => updateMasterField(el.dataset.id, el.dataset.fieldMaster, el.value);
    if(el.tagName==='SELECT') el.onchange = handler; else el.onblur = handler;
  });
  document.querySelectorAll('[data-field-bo]').forEach(el => {
    const handler = () => updateBoReportField(el.dataset.id, el.dataset.fieldBo, el.value);
    if(el.tagName === 'SELECT') el.onchange = handler; else el.onblur = handler;
  });

  document.querySelectorAll('[data-del-master]').forEach(b => b.onclick = () => softDelete('master', b.dataset.delMaster));
  document.querySelectorAll('[data-restore-master]').forEach(b => b.onclick = () => restore('master', b.dataset.restoreMaster));
  document.querySelectorAll('[data-del-territory]').forEach(b => b.onclick = () => softDelete('territory', b.dataset.delTerritory));
  document.querySelectorAll('[data-restore-territory]').forEach(b => b.onclick = () => restore('territory', b.dataset.restoreTerritory));


  document.querySelectorAll('[data-history-track]').forEach(b => b.onclick = () =>
    openHistory(b.dataset.historyTrack, b.dataset.historyPais));
  const closeH = document.getElementById('closeHistory');
  if(closeH) closeH.onclick = () => { state.history = null; render(); };
  const bgH = document.getElementById('historyBg');
  if(bgH) bgH.onclick = (e) => { if(e.target === bgH){ state.history = null; render(); } };

  const exM = document.getElementById('exportMaster');
  if(exM) exM.onclick = () => openEnvioDialog('csv_principal');
  const exBo = document.getElementById('exportBo');
  if(exBo) exBo.onclick = () => openEnvioDialog('reporte_bo');
  document.querySelectorAll('[data-envio-modo]').forEach(b => b.onclick = () => startEnvio(b.dataset.envioModo));
  const closeE = document.getElementById('closeEnvio');
  if(closeE) closeE.onclick = () => { if(!state.envioBusy){ state.envioDialog = null; render(); } };
  const bgE = document.getElementById('envioBg');
  if(bgE) bgE.onclick = (e) => { if(e.target === bgE && !state.envioBusy){ state.envioDialog = null; render(); } };
  const exT = document.getElementById('exportTerritory');
  if(exT) exT.onclick = () => downloadFilteredCsv('fn_territory_exportar', {
    p_date_from: state.dateFrom || null, p_date_to: state.dateTo || null,
    p_pais: state.territoryCountry || null, p_buscar: state.search || null,
    p_reclamos: state.reclamosFilter || null, p_estado_trabajo: state.estadoTrabajoFilter || null,
  }, `tabla_territorio${state.territoryCountry?'_'+state.territoryCountry:''}.csv`);

  const dz = document.getElementById('dropzone'); const fi = document.getElementById('fileInput');
  if(dz){
    dz.onclick = () => fi.click();
    dz.ondragover = (e) => { e.preventDefault(); dz.classList.add('over'); };
    dz.ondragleave = () => dz.classList.remove('over');
    dz.ondrop = (e) => { e.preventDefault(); dz.classList.remove('over'); handleFiles(e.dataTransfer.files); };
    fi.onchange = (e) => { handleFiles(e.target.files); };
  }
}

// ---------- Arranque ----------
(async function init(){
  const { data } = await sb.auth.getSession();
  if(data.session){
    state.session = data.session;
    await loadProfile();
    await loadAll();
  } else {
    render();
  }
})();
</script>
